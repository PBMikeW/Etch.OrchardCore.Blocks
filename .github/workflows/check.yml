name: Check

# The blocks editor factory's checks (scripts/factory.check.mjs): the one check this fork has, so a pull request
# shows a green tick before it is merged. The script needs only node built-ins (it stubs every package import), so
# nothing is installed: this package's versions are pnpm "catalog:" entries that npm cannot resolve on its own.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
